name: Update rules from RoscomVPN

on:
  schedule:
    # roscomvpn-geoip пересобирается в 03:10 UTC, geosite — при каждом пуше в master
    - cron: "40 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Тесты
        run: python3 -m unittest discover -s tests -v

      - name: Сборка списков и конфигов
        env:
          BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python3 build.py --base-url "$BASE_URL"

      - name: Проверка собранного
        run: python3 build.py --check

      - name: Коммит и пуш
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules roscomvpn.conf roscomvpn-whitelist.conf
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "Обновление списков RoscomVPN $(date -u +%Y-%m-%d) [skip ci]"
          git push
